<!DOCTYPE html>
<!-- og share card template; tools/update_ogcard.py copies it to the repo
     root before rendering, so asset paths are root-relative. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #ffffff 0%, #e9f0fb 60%, #dbe7f8 100%);
    display: flex; align-items: center;
    position: relative; overflow: hidden;
  }
  .bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 14px;
    background: linear-gradient(180deg, #3b82f6, #4f46e5);
  }
  .card { display: flex; align-items: center; gap: 64px; padding: 0 84px 0 96px; width: 100%; }
  .info { flex: 1; }
  h1 { font-size: 84px; font-weight: 700; letter-spacing: -0.02em; color: #16305c; }
  .role {
    display: inline-block; margin-top: 26px;
    font-size: 27px; font-weight: 600; letter-spacing: 0.06em;
    color: #fff; background: #16305c; padding: 8px 26px; border-radius: 999px;
  }
  .affil { margin-top: 30px; font-size: 30px; line-height: 1.5; color: #4b5563; }
  .stats { margin-top: 34px; display: flex; gap: 56px; }
  .stat small { display: block; font-size: 19px; font-weight: 600; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase; }
  .stat strong { font-size: 46px; font-weight: 700; color: #16305c; }
  .url { margin-top: 34px; font-size: 24px; font-weight: 600; color: #2563eb; letter-spacing: 0.02em; }
  .photo img {
    width: 300px; height: 300px; object-fit: cover;
    border-radius: 32px; border: 8px solid #fff;
    box-shadow: 0 16px 48px rgba(22, 48, 92, 0.22);
  }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="card">
    <div class="info">
      <h1>Xinggang Wang</h1>
      <span class="role">PROFESSOR</span>
      <p class="affil">School of Electronic Information and Communications<br>Huazhong University of Science and Technology</p>
      <div class="stats">
        <div class="stat"><small>Citations</small><strong>{{CITATIONS}}</strong></div>
        <div class="stat"><small>H-index</small><strong>{{HINDEX}}</strong></div>
      </div>
      <p class="url">xwcv.github.io</p>
    </div>
    <div class="photo"><img src="res/xw-standard.png" alt=""></div>
  </div>
</body>
</html>
