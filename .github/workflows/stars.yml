name: Update GitHub star counts

on:
  schedule:
    # 04:23 UTC, every Monday
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch star counts and update res/stars.json
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_stars.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet res/stars.json; then
            echo "no change"
          else
            # star counts render on pubs.htm, so a change means fresh page
            # content — keep the sitemap lastmod dates in sync
            sed -i -e "s|<lastmod>[0-9-]*</lastmod>|<lastmod>$(date +%F)</lastmod>|g" sitemap.xml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add res/stars.json sitemap.xml
            git commit -m "Update GitHub star counts"
            git push
          fi
