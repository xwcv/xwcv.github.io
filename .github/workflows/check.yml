name: Check static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated files are current
        run: python3 tools/build_site.py --check
      - name: Validate content, links and metadata
        run: python3 tools/check_site.py
      - name: Check JavaScript syntax
        run: node --check res/site.js
