name: Update Google Scholar stats

on:
  schedule:
    # 03:17 UTC, every Monday and Thursday (1 SerpAPI request per run)
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and update res/scholar.json
        timeout-minutes: 10
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python3 tools/update_scholar.py

      - name: Sync badge numbers on the homepages
        run: python3 tools/update_badges.py

      - name: Site consistency checks (non-blocking)
        continue-on-error: true
        run: python3 tools/check_site.py

      - name: Regenerate the og share card with fresh numbers
        run: python3 tools/update_ogcard.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet res/scholar.json index.html index_cn.html && git diff --quiet res/og-card.png; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add res/scholar.json index.html index_cn.html res/og-card.png
            git commit -m "Update Google Scholar stats"
            git push
          fi
