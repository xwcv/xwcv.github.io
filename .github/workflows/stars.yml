name: Update GitHub star counts

on:
  schedule:
    # 04:23 UTC, every Monday
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch star counts and update res/stars.json
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_stars.py

      - name: Sync badge numbers on the homepages
        run: python3 tools/update_badges.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet res/stars.json; then
            echo "no change"
          else
            # star counts render on pubs.htm, so a change means fresh page
            # content — keep the sitemap lastmod dates in sync
            sed -i -e "s|<lastmod>[0-9-]*</lastmod>|<lastmod>$(date +%F)</lastmod>|g" sitemap.xml
            # refresh the footer date (and © year) on every page
            EN_DATE=$(date +'%B %Y'); CN_DATE=$(date +'%Y年%-m月'); YEAR=$(date +%Y)
            sed -i -e "s|© [0-9]\{4\} Xinggang Wang · Last updated: [A-Za-z]* [0-9]\{4\}|© $YEAR Xinggang Wang · Last updated: $EN_DATE|" index.htm pubs.htm group.htm
            sed -i -e "s|© [0-9]\{4\} 王兴刚 · 最近更新：[0-9]\{4\}年[0-9]\{1,\}月|© $YEAR 王兴刚 · 最近更新：$CN_DATE|" index_cn.htm group_cn.htm
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add res/stars.json sitemap.xml index.htm pubs.htm group.htm index_cn.htm group_cn.htm
            git commit -m "Update GitHub star counts"
            git push
          fi
